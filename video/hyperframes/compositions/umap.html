<template>
  <div id="root" data-composition-id="umap" data-width="1920" data-height="1080" data-duration="5.4" data-fps="30">
    <style>
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(1200px 820px at 52% 50%, #171c20 0%, #0d1013 60%, #090b0d 100%);
        color: #f2f4f3;
        font-family: Inter, system-ui, sans-serif;
      }

      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .title {
        position: absolute;
        left: 90px;
        top: 54px;
      }

      .title h1 {
        font-size: 60px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
        margin: 0;
        color: #f2f4f3;
      }

      .title p {
        margin-top: 14px;
        font-size: 28px;
        font-weight: 500;
        color: #93a0a8;
      }

      .chapter {
        position: absolute;
        right: 90px;
        top: 64px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #93a0a8;
        opacity: 0;
      }

      .chapter b {
        color: #f2b544;
      }

      .plot-wrap {
        position: absolute;
        left: 90px;
        top: 180px;
        width: 1740px;
        height: 780px;
        opacity: 0;
      }

      #umap-plot {
        width: 100%;
        height: 100%;
        display: block;
      }

      #umap-overlay {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
        pointer-events: none;
      }

      .cluster-label {
        position: absolute;
        display: flex;
        align-items: baseline;
        gap: 10px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(5, 8, 10, 0.95), 0 0 6px rgba(5, 8, 10, 0.85);
      }

      .cluster-label b {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f2f4f3;
      }

      .cluster-label span {
        font-size: 28px;
        font-weight: 600;
        color: #93a0a8;
        font-variant-numeric: tabular-nums;
      }

      .star {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 30px;
        font-weight: 700;
        color: #f2f4f3;
        opacity: 0;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 0 2px 14px rgba(5, 8, 10, 0.95), 0 0 6px rgba(5, 8, 10, 0.85);
      }

      .star i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f2b544;
        display: inline-block;

      .legend {
        position: absolute;
        left: 90px;
        bottom: 52px;
        display: flex;
        align-items: center;
        gap: 30px;
        opacity: 0;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 28px;
        font-weight: 600;
        color: #93a0a8;
      }

      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }
    </style>

    <div id="umap-clip" class="clip" data-start="0" data-duration="5.4" data-track-index="0">
      <div id="umap-title" class="title">
        <h1>UMAP — espacio de jugadores</h1>
        <p>1.201 jugadores · K-Means (k=4) · 21 features · mismos arquetipos en las tres ligas</p>
      </div>

      <div id="umap-chapter" class="chapter"><b>05</b> / CLUSTERS</div>

      <div id="umap-plot-wrap" class="plot-wrap">
        <svg id="umap-plot" viewBox="0 0 1740 780" preserveAspectRatio="none" aria-hidden="true">
          <g id="umap-points"></g>
          <g id="umap-rings"></g>
        </svg>
      </div>

      <svg id="umap-overlay" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
        <g id="umap-lines"></g>
      </svg>

      <div id="umap-label-0" class="cluster-label"><b>Finalizadores</b><span>322</span></div>
      <div id="umap-label-1" class="cluster-label"><b>Defensores / volantes</b><span>629</span></div>
      <div id="umap-label-2" class="cluster-label"><b>Arqueros</b><span>80</span></div>
      <div id="umap-label-3" class="cluster-label"><b>Creadores</b><span>170</span></div>

      <div id="umap-star-3359" class="star"><i></i>Messi</div>
      <div id="umap-star-3322" class="star"><i></i>Cristiano</div>

      <div id="umap-legend" class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#f2b544"></span>Finalizadores</div>
        <div class="legend-item"><span class="legend-dot" style="background:#35b3ab"></span>Defensores / volantes</div>
        <div class="legend-item"><span class="legend-dot" style="background:#93a0a8"></span>Arqueros</div>
        <div class="legend-item"><span class="legend-dot" style="background:#7ad151"></span>Creadores</div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        var DATA = (window.HF_DATA && window.HF_DATA.umap) || null;
        var PLAYERS = DATA ? DATA.players : [];
        var CLUSTERS = {
          0: { name: "Finalizadores", color: "#f2b544" },
          1: { name: "Defensores / volantes", color: "#35b3ab" },
          2: { name: "Arqueros", color: "#93a0a8" },
          3: { name: "Creadores", color: "#7ad151" },
        };

        var NS = "http://www.w3.org/2000/svg";
        var PLOT_W = 1740;
        var PLOT_H = 780;
        var WRAP_X = 90;
        var WRAP_Y = 180;
        var pointsGroup = document.getElementById("umap-points");
        var ringsGroup = document.getElementById("umap-rings");
        var linesGroup = document.getElementById("umap-lines");
        var plotWrap = document.getElementById("umap-plot-wrap");
        var legend = document.getElementById("umap-legend");
        var title = document.getElementById("umap-title");
        var chapter = document.getElementById("umap-chapter");

        var xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
        PLAYERS.forEach(function (p) {
          if (p.x < xmin) xmin = p.x;
          if (p.x > xmax) xmax = p.x;
          if (p.y < ymin) ymin = p.y;
          if (p.y > ymax) ymax = p.y;
        });
        var dw = Math.max(1e-6, xmax - xmin);
        var dh = Math.max(1e-6, ymax - ymin);
        var pad = 0.07;
        var scale = Math.min((PLOT_W * (1 - pad * 2)) / dw, (PLOT_H * (1 - pad * 2)) / dh);
        var ox = (PLOT_W - dw * scale) / 2;
        var oy = (PLOT_H - dh * scale) / 2;

        function sx(p) { return ox + (p.x - xmin) * scale; }
        function sy(p) { return oy + (ymax - p.y) * scale; }
        function fx(p) { return WRAP_X + sx(p); }
        function fy(p) { return WRAP_Y + sy(p); }

        var byCluster = { 0: [], 1: [], 2: [], 3: [] };
        var nodes = new Map();
        PLAYERS.forEach(function (p) {
          var c = document.createElementNS(NS, "circle");
          c.setAttribute("cx", sx(p).toFixed(2));
          c.setAttribute("cy", sy(p).toFixed(2));
          c.setAttribute("r", "0");
          c.setAttribute("fill", (CLUSTERS[p.cluster] || CLUSTERS[0]).color);
          c.setAttribute("opacity", "0");
          pointsGroup.appendChild(c);
          nodes.set(p.id, c);
          (byCluster[p.cluster] || byCluster[0]).push(p);
        });

        Object.keys(byCluster).forEach(function (k) {
          byCluster[k].sort(function (a, b) { return a.x - b.x; });
        });

        function reveal(k, progress) {
          var list = byCluster[k];
          var n = Math.floor(list.length * progress);
          for (var i = 0; i < list.length; i += 1) {
            var node = nodes.get(list[i].id);
            if (i < n) {
              node.setAttribute("r", "6.2");
              node.setAttribute("opacity", "0.92");
            } else {
              node.setAttribute("r", "0");
              node.setAttribute("opacity", "0");
            }
          }
        }

        function centerOf(k) {
          var list = byCluster[k];
          if (!list.length) return { x: 0, y: 0 };
          var mx = 0, my = 0;
          list.forEach(function (p) { mx += p.x; my += p.y; });
          return { x: mx / list.length, y: my / list.length };
        }

        function addLeader(x1, y1, x2, y2) {
          var line = document.createElementNS(NS, "line");
          var len = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
          line.setAttribute("x1", x1.toFixed(1));
          line.setAttribute("y1", y1.toFixed(1));
          line.setAttribute("x2", x2.toFixed(1));
          line.setAttribute("y2", y2.toFixed(1));
          line.setAttribute("stroke", "rgba(242,244,243,0.4)");
          line.setAttribute("stroke-width", "1.5");
          line.setAttribute("stroke-dasharray", len.toFixed(1));
          line.setAttribute("stroke-dashoffset", len.toFixed(1));
          linesGroup.appendChild(line);
          return line;
        }

        var labelOffsets = { 0: -66, 1: 66, 2: -54, 3: -58 };
        var leaderLines = {};
        Object.keys(byCluster).forEach(function (k) {
          var c = centerOf(k);
          var el = document.getElementById("umap-label-" + k);
          var cx = WRAP_X + ox + (c.x - xmin) * scale;
          var cy = WRAP_Y + oy + (ymax - c.y) * scale;
          var ly = cy + labelOffsets[k];
          el.style.left = cx.toFixed(1) + "px";
          el.style.top = ly.toFixed(1) + "px";
          el.style.transform = "translate(-50%, -50%)";

          var dot = document.createElementNS(NS, "circle");
          dot.setAttribute("cx", (cx - WRAP_X).toFixed(1));
          dot.setAttribute("cy", (cy - WRAP_Y).toFixed(1));
          dot.setAttribute("r", "3");
          dot.setAttribute("fill", "rgba(242,244,243,0.55)");
          dot.setAttribute("opacity", "0");
          ringsGroup.appendChild(dot);

          var gap = labelOffsets[k] < 0 ? -18 : 18;
          leaderLines[k] = addLeader(cx, cy, cx, ly + gap);
          el._dot = dot;
        });

        var stars = [
          { id: 3359, dy: -56 },
          { id: 3322, dy: 60 },
        ];
        stars.forEach(function (s) {
          var p = null;
          for (var i = 0; i < PLAYERS.length; i += 1) {
            if (PLAYERS[i].id === s.id) { p = PLAYERS[i]; break; }
          }
          if (!p) return;
          var el = document.getElementById("umap-star-" + s.id);
          if (!el) return;
          var px = fx(p);
          var py = fy(p);
          var ly = py + s.dy;
          el.style.left = px.toFixed(1) + "px";
          el.style.top = ly.toFixed(1) + "px";

          var ring = document.createElementNS(NS, "circle");
          ring.setAttribute("cx", sx(p).toFixed(2));
          ring.setAttribute("cy", sy(p).toFixed(2));
          ring.setAttribute("r", "11");
          ring.setAttribute("fill", "none");
          ring.setAttribute("stroke", "#f2f4f3");
          ring.setAttribute("stroke-width", "1.8");
          ring.setAttribute("opacity", "0");
          ringsGroup.appendChild(ring);

          var gap = s.dy < 0 ? -22 : 22;
          var line = addLeader(px, py, px, ly + gap);
          el._ring = ring;
          el._line = line;
        });

        gsap.set(title, { opacity: 0, y: 16 });
        gsap.set(plotWrap, { opacity: 0, scale: 0.985 });
        gsap.set(legend, { opacity: 0, y: 10 });
        gsap.set(".cluster-label", { opacity: 0 });
        gsap.set(".star", { opacity: 0 });

        var p0 = { v: 0 }, p1 = { v: 0 }, p2 = { v: 0 }, p3 = { v: 0 };
        var tl = gsap.timeline({ paused: true });

        tl.to(title, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.02);
        tl.to(chapter, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.12);
        tl.to(plotWrap, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 0.1);
        tl.to(legend, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.45);

        tl.to(p0, { v: 1, duration: 0.72, ease: "power2.out", onUpdate: function () { reveal(0, p0.v); } }, 0.5);
        tl.to(p1, { v: 1, duration: 0.95, ease: "power2.out", onUpdate: function () { reveal(1, p1.v); } }, 0.95);
        tl.to(p2, { v: 1, duration: 0.55, ease: "power2.out", onUpdate: function () { reveal(2, p2.v); } }, 1.55);
        tl.to(p3, { v: 1, duration: 0.8, ease: "power2.out", onUpdate: function () { reveal(3, p3.v); } }, 1.95);

        function labelIn(k, at) {
          var el = document.getElementById("umap-label-" + k);
          var line = leaderLines[k];
          tl.to(el, { opacity: 1, duration: 0.28, ease: "power2.out" }, at);
          tl.to(el._dot, { attr: { opacity: 1 }, duration: 0.24, ease: "power2.out" }, at - 0.04);
          tl.to(
            line,
            { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" },
            at - 0.08,
          );
        }

        labelIn(0, 1.12);
        labelIn(1, 1.82);
        labelIn(2, 2.02);
        labelIn(3, 2.68);

        gsap.utils.toArray(".star").forEach(function (el, i) {
          var at = 2.75 + i * 0.06;
          tl.to(el, { opacity: 1, duration: 0.24, ease: "power2.out" }, at);
          if (el._ring) {
            tl.to(el._ring, { attr: { opacity: 0.9 }, duration: 0.24, ease: "power2.out" }, at);
          }
          if (el._line) {
            tl.to(
              el._line,
              { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" },
              at - 0.08,
            );
          }
        });

        tl.to({}, { duration: 1.75 }, 3.65);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["umap"] = tl;
      })();
    </script>
  </div>
</template>
