    <script>
      (function () {
        "use strict";

        var DATA = (window.HF_DATA && window.HF_DATA.xt) || null;
        var NM = DATA ? DATA.grid : { m: 16, n: 12 };
        var MAX = DATA ? DATA.max : 0.269;
        var ITERS = DATA ? DATA.iterations : [{ iter: 1, dmax: 0.2234, values: [] }];

        var NS = "http://www.w3.org/2000/svg";
        var cellsGroup = document.getElementById("xt-cells");
        var pitchWrap = document.getElementById("xt-pitch-wrap");
        var panel = document.getElementById("xt-panel");
        var title = document.getElementById("xt-title");
        var chapter = document.getElementById("xt-chapter");
        var note = document.getElementById("xt-note");
        var iterEl = document.getElementById("xt-iter");
        var dmaxEl = document.getElementById("xt-dmax");
        var maxEl = document.getElementById("xt-max");
        var hot = document.getElementById("xt-hot");
        var hotPulse = document.getElementById("xt-hot-pulse");

        var CW = 105 / NM.m;
        var CH = 68 / NM.n;
        var cells = [];
        var stops = [
          [0.0, [68, 1, 84]],
          [0.25, [59, 82, 139]],
          [0.5, [33, 145, 140]],
          [0.75, [94, 201, 98]],
          [1.0, [253, 231, 37]],
        ];

        function colorAt(u) {
          u = Math.max(0, Math.min(1, u));
          for (var i = 1; i < stops.length; i += 1) {
            if (u <= stops[i][0]) {
              var a = stops[i - 1];
              var b = stops[i];
              var p = (u - a[0]) / (b[0] - a[0]);
              var r = Math.round(a[1][0] + (b[1][0] - a[1][0]) * p);
              var g = Math.round(a[1][1] + (b[1][1] - a[1][1]) * p);
              var bl = Math.round(a[1][2] + (b[1][2] - a[1][2]) * p);
              return "rgb(" + r + "," + g + "," + bl + ")";
            }
          }
          return "rgb(253,231,37)";
        }

        for (var j = 0; j < NM.n; j += 1) {
          for (var i = 0; i < NM.m; i += 1) {
            var rect = document.createElementNS(NS, "rect");
            rect.setAttribute("x", (i * CW).toFixed(4));
            rect.setAttribute("y", ((NM.n - 1 - j) * CH).toFixed(4));
            rect.setAttribute("width", CW.toFixed(4));
            rect.setAttribute("height", CH.toFixed(4));
            rect.setAttribute("fill", "#440154");
            cellsGroup.appendChild(rect);
            cells.push(rect);
          }
        }

        function gridAt(t) {
          var lo = Math.max(0, Math.min(ITERS.length - 1, Math.floor(t)));
          var hi = Math.min(ITERS.length - 1, lo + 1);
          var p = Math.max(0, Math.min(1, t - lo));
          var A = ITERS[lo].values;
          var B = ITERS[hi].values;
          return { A: A, B: B, p: p, lo: lo, hi: hi };
        }

        function render(t) {
          var g = gridAt(t);
          var idx = 0;
          for (var j = 0; j < NM.n; j += 1) {
            for (var i = 0; i < NM.m; i += 1) {
              var va = g.A[j] && g.A[j][i] != null ? g.A[j][i] : 0;
              var vb = g.B[j] && g.B[j][i] != null ? g.B[j][i] : va;
              var v = va + (vb - va) * g.p;
              cells[idx].setAttribute("fill", colorAt(v / MAX));
              idx += 1;
            }
          }
          var it = Math.min(ITERS.length, Math.floor(t) + 1);
          iterEl.textContent = String(it).padStart(2, "0");
          dmaxEl.textContent = Number(ITERS[it - 1].dmax).toFixed(4).replace(".", ",");
        }

        maxEl.textContent = Number(MAX).toFixed(3).replace(".", ",");

        var state = { t: 0 };
        var tl = gsap.timeline({ paused: true });

        gsap.set(title, { opacity: 0, y: 18 });
        gsap.set(pitchWrap, { opacity: 0, scale: 0.965 });
        gsap.set(panel, { opacity: 0, x: 24 });
        gsap.set(hot, { opacity: 0 });

        tl.to(title, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.02);
        tl.to(chapter, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.12);
        tl.to(pitchWrap, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 0.1);
        tl.to(panel, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.18);
        tl.to(note, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.4);

        tl.to(
          state,
          {
            t: ITERS.length - 1,
            duration: 2.35,
            ease: "power2.inOut",
            onUpdate: function () {
              render(state.t);
            },
          },
          0.55,
        );

        tl.to(hot, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.0);
        tl.fromTo(
          hotPulse,
          { attr: { r: 1.2 }, opacity: 0.9 },
          { attr: { r: 2.8 }, opacity: 0, duration: 0.8, ease: "power2.out" },
          3.05,
        );
        tl.to({}, { duration: 0.4 }, 3.6);

        tl.seek(0);
        render(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["xt"] = tl;
      })();
