    <script>
      (function () {
        "use strict";

        var TOTAL = 3251294;
        var DURATION = 3.2;
        var COUNT_START = 0.28;
        var COUNT_DURATION = 1.62;
        var FPS = 30;

        var valueEl = document.getElementById("counter-value");
        var kicker = document.getElementById("counter-kicker");
        var chapter = document.getElementById("counter-chapter");
        var caption = document.getElementById("counter-caption");
        var ticker = document.getElementById("counter-ticker");
        var source = document.getElementById("counter-source");
        var rule = document.getElementById("counter-rule");

        function formatNumber(n) {
          return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        var lastFrame = Math.round(COUNT_DURATION * FPS);
        var ease = gsap.parseEase("sine.inOut");
        var rows = [];
        for (var f = 0; f <= lastFrame; f += 1) {
          var p = f / lastFrame;
          rows.push(formatNumber(TOTAL * ease(p)));
        }
        rows[rows.length - 1] = formatNumber(TOTAL);

        gsap.set(valueEl, { y: 26, scale: 0.985 });
        gsap.set(ticker.querySelectorAll("span"), { y: 14, opacity: 0 });

        var tl = gsap.timeline({ paused: true });

        tl.to(kicker, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 0.02);
        tl.to(chapter, { opacity: 1, duration: 0.38, ease: "power3.out" }, 0.08);

        tl.to(valueEl, { y: 0, scale: 1, duration: 0.34, ease: "power3.out" }, 0.18);

        rows.forEach(function (row, i) {
          tl.set(valueEl, { textContent: row }, COUNT_START + COUNT_DURATION * (i / lastFrame));
        });

        tl.to(valueEl, { scale: 1.035, duration: 0.14, ease: "power3.out" }, COUNT_START + COUNT_DURATION);
        tl.to(valueEl, { scale: 1, duration: 0.22, ease: "power2.out" }, COUNT_START + COUNT_DURATION + 0.14);

        tl.to(caption, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, COUNT_START + 0.42);

        var words = ticker.querySelectorAll("span");
        words.forEach(function (word, i) {

            opacity: 1,
            y: 0,
            duration: 0.3,
            ease: "power4.out",
          }, 0.52 + i * 0.055);

        tl.to(ticker.querySelectorAll("i"), { opacity: 0.55, duration: 0.24, ease: "power2.out" }, 0.62);

        tl.to(source, { opacity: 1, duration: 0.38, ease: "power2.out" }, 0.7);
        tl.to(rule, { scaleX: 1, duration: COUNT_DURATION, ease: "sine.inOut" }, COUNT_START);

        tl.to({}, { duration: 0.6 }, 2.55);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["counter"] = tl;
