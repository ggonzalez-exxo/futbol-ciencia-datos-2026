<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fútbol · Ciencia de Datos — Piezas de datos</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/data/counter.js"></script>
    <script src="assets/data/xt.js"></script>
    <script src="assets/data/heatmap.js"></script>
    <script src="assets/data/umap.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0e11;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #0b0e11;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="17"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div
        id="counter"
        class="clip"
        data-composition-id="counter"
        data-composition-src="compositions/counter.html"
        data-start="0"
        data-duration="3.2"
        data-track-index="0"
        data-track-kind="graphics"
      ></div>
      <div
        id="xt"
        class="clip"
        data-composition-id="xt"
        data-composition-src="compositions/xt.html"
        data-start="3.2"
        data-duration="4.2"
        data-track-index="0"
        data-track-kind="graphics"
      ></div>
      <div
        id="heatmap"
        class="clip"
        data-composition-id="heatmap"
        data-composition-src="compositions/heatmap.html"
        data-start="7.4"
        data-duration="4.2"
        data-track-index="0"
        data-track-kind="graphics"
      ></div>
      <div
        id="umap"
        class="clip"
        data-composition-id="umap"
        data-composition-src="compositions/umap.html"
        data-start="11.6"
        data-duration="5.4"
        data-track-index="0"
        data-track-kind="graphics"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
