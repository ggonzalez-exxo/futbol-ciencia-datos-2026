    <script>
      (function () {
        "use strict";

        var DATA = (window.HF_DATA && window.HF_DATA.heatmap) || null;
        var NM = DATA ? DATA.grid : { m: 16, n: 12 };
        var PANELS = DATA ? DATA.panels : [
          { name: "L. Messi", values: [] },
          { name: "Cristiano Ronaldo", values: [] },
        ];

        var NS = "http://www.w3.org/2000/svg";
        var CW = 105 / NM.m;
        var CH = 68 / NM.n;
        var panels = [
          { cells: [], values: PANELS[0].values || [] },
          { cells: [], values: PANELS[1].values || [] },
        ];
        var stops = [
          [0.0, [11, 16, 32]],
          [0.16, [42, 26, 94]],
          [0.32, [59, 47, 143]],
          [0.52, [31, 122, 140]],
          [0.7, [43, 182, 115]],
          [0.86, [163, 230, 53]],
          [1.0, [253, 224, 71]],
        ];

        function colorAt(u) {
          u = Math.max(0, Math.min(1, u));
          for (var i = 1; i < stops.length; i += 1) {
            if (u <= stops[i][0]) {
              var a = stops[i - 1];
              var b = stops[i];
              var p = (u - a[0]) / (b[0] - a[0]);
              var r = Math.round(a[1][0] + (b[1][0] - a[1][0]) * p);
              var g = Math.round(a[1][1] + (b[1][1] - a[1][1]) * p);
              var bl = Math.round(a[1][2] + (b[1][2] - a[1][2]) * p);
              return "rgb(" + r + "," + g + "," + bl + ")";
            }
          }
          return "rgb(253,224,71)";
        }

        for (var k = 0; k < 2; k += 1) {
          var group = document.getElementById("hm-cells-" + k);
          for (var j = 0; j < NM.n; j += 1) {
            for (var i = 0; i < NM.m; i += 1) {
              var rect = document.createElementNS(NS, "rect");
              rect.setAttribute("x", (i * CW).toFixed(4));
              rect.setAttribute("y", ((NM.n - 1 - j) * CH).toFixed(4));
              rect.setAttribute("width", CW.toFixed(4));
              rect.setAttribute("height", CH.toFixed(4));
              rect.setAttribute("fill", "#080c10");
              rect.setAttribute("stroke", "rgba(255,255,255,0.03)");
              rect.setAttribute("stroke-width", "0.03");
              group.appendChild(rect);
              panels[k].cells.push(rect);
            }
          }
        }

        var lo = Infinity;
        var hi = -Infinity;
        for (var kk = 0; kk < 2; kk += 1) {
          var vv = panels[kk].values;
          for (var jj = 0; jj < NM.n; jj += 1) {
            for (var ii = 0; ii < NM.m; ii += 1) {
              var value = vv[jj] && vv[jj][ii] != null ? vv[jj][ii] : 0;
              if (value < lo) lo = value;
              if (value > hi) hi = value;
            }
          }
        }

        function render(t) {
          var thr = lo + (hi - lo + 0.0001) * Math.max(0, Math.min(1, t));
          for (var k = 0; k < 2; k += 1) {
            var values = panels[k].values;
            var idx = 0;
            for (var j = 0; j < NM.n; j += 1) {
              for (var i = 0; i < NM.m; i += 1) {
                var v = values[j] && values[j][i] != null ? values[j][i] : 0;
                var fill = v <= thr ? colorAt(v) : "#080c10";
                panels[k].cells[idx].setAttribute("fill", fill);
                idx += 1;
              }
            }
          }
        }

        var title = document.getElementById("hm-title");
        var chapter = document.getElementById("hm-chapter");
        var legend = document.getElementById("hm-legend");
        var panelEls = [document.getElementById("hm-panel-0"), document.getElementById("hm-panel-1")];

        gsap.set(title, { opacity: 0, y: 16 });
        gsap.set(panelEls, { opacity: 0, y: 20 });
        gsap.set(legend, { opacity: 0, y: 10 });

        var state = { t: 0 };
        var tl = gsap.timeline({ paused: true });

        tl.to(title, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.02);
        tl.to(chapter, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.12);
        tl.to(panelEls[0], { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.14);
        tl.to(panelEls[1], { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.26);
        tl.to(legend, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.5);

        tl.to(
          state,
          {
            t: 1,
            duration: 2.45,
            ease: "power1.inOut",
            onUpdate: function () {
              render(state.t);
            },
            onComplete: function () {
              state.t = 1;
              render(1);
            },
          },
          0.55,
        );

        tl.to({}, { duration: 0.6 }, 3.2);

        tl.seek(0);
        render(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["heatmap"] = tl;
      })();
